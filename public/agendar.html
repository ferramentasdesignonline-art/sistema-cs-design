<script>const t=location.pathname.split('/')[2]||'',f=document.getElementById('f'),m=document.getElementById('m'),$=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),nm=d=>new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});let P={},loja='';const tipo=new URLSearchParams(location.search).get('tipo')==='onboarding'?'Onboarding':'Reunião';if(tipo==='Onboarding')$('tt').textContent='Sua reunião de entrada';
